<style>

<div class="app">
  <header>

  </footer>
</div>
<script id="payload" type="application/json">/*DATA*/</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("payload").textContent);
if (window.self !== window.top) { document.body.classList.add("framed"); document.documentElement.dataset.theme = "light"; }
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const MONTHS = ["Jan.", "Feb.", "March", "April", "May", "June", "July", "Aug.", "Sept.", "Oct.", "Nov.", "Dec."];
const G = D.geo, PARKS = D.parks, BY = Object.fromEntries(PARKS.map(p => [p.code, p]));

// ---------- numbers ----------
// half away from zero, so the tie-out can match it exactly
const round = (v, d = 0) => { const f = 10 ** d; return Math.sign(v) * Math.round(Math.abs(v) * f) / f; };
const int = v => round(v).toLocaleString("en-US");
function big(v) { // 1,234,567 -> "1.2 million"
  const a = Math.abs(v);
  if (a >= 1e9) return round(v / 1e9, 1).toLocaleString("en-US", { minimumFractionDigits: 1 }) + " billion";
  if (a >= 1e6) return round(v / 1e6, 1).toLocaleString("en-US", { minimumFractionDigits: 1 }) + " million";
  return int(v);
}
const usd = v => "$" + big(v);
const money = v => v === 0 ? "$0" : "$" + (v >= 1e9 ? round(v / 1e9, 1) + "B" : v >= 1e6 ? round(v / 1e6, 1) + "M" : round(v / 1e3) + "K");
const usd2 = v => "$" + round(v, 2).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = v => { const r = round(v); return (r > 0 ? "+" : r < 0 ? "−" : "") + Math.abs(r).toLocaleString("en-US") + "%"; };
const change = (a, b) => (a > 0 && b != null) ? (b / a - 1) * 100 : null;
const updown = v => round(v) === 0 ? "about the same as" : (v > 0 ? "up " : "down ") + Math.abs(round(v)).toLocaleString("en-US") + "% from";

// ---------- series ----------
// every series is {y0, v:[...]} with null for years not published
const at = (s, y) => (s && y >= s.y0 && y < s.y0 + s.v.length) ? s.v[y - s.y0] : null;
const years = s => s ? s.v.map((_, i) => s.y0 + i) : [];
const lastYear = s => { if (!s) return null; for (let i = s.v.length - 1; i >= 0; i--) if (s.v[i] != null) return s.y0 + i; return null; };
const firstYear = s => { if (!s) return null; for (let i = 0; i < s.v.length; i++) if (s.v[i] != null) return s.y0 + i; return null; };
const CPI = D.cpi, CPI_BASE = D.cpi_base_fy;
const real = (v, fy) => (v == null || at(CPI, fy) == null) ? null : v * at(CPI, CPI_BASE) / at(CPI, fy);
function mapS(s, f) { return s ? { y0: s.y0, v: s.v.map((v, i) => v == null ? null : f(v, s.y0 + i)) } : null; }

for (const p of PARKS) {
  p.budgetReal = mapS(p.budget && p.budget.base_k, (v, fy) => real(v * 1000, fy));
  // visits for the whole budget line (shared lines sum their parks' visits)
  const members = p.budget_members.map(c => BY[c] || null);
  p.lineVisits = p.budget ? { y0: p.budget.base_k.y0, v: p.budget.base_k.v.map((_, i) => {
    const y = p.budget.base_k.y0 + i;
    const vals = members.map(m => m ? at(m.visits, y) : null);
    return vals.some(v => v == null) ? null : vals.reduce((a, b) => a + b, 0);
  }) } : null;
  p.perVisit = p.budgetReal && p.per_visit_ok && !(p.visit_note && p.visit_note.no_compare) ? { y0: p.budgetReal.y0, v: p.budgetReal.v.map((v, i) => {
    const n = p.lineVisits.v[i]; return (v == null || !n) ? null : v / n; }) } : null;
}

// ---------- map metrics ----------
const VB = D.compare.visits, FB = D.compare.budget;
const noCmp = p => !!(p.visit_note && p.visit_note.no_compare);
const METRICS = [
  { id: "visits", label: `Change in visits, ${VB[0]} to ${VB[1]}`, val: p => noCmp(p) ? null : change(at(p.visits, VB[0]), at(p.visits, VB[1])) },
  { id: "budget", label: `Change in base budget after inflation, FY${FB[0]} to FY${FB[1]}`, val: p => change(at(p.budgetReal, FB[0]), at(p.budgetReal, FB[1])) },
  { id: "staff", label: `Change in staff (${D.fte_label}), FY${FB[0]} to FY${FB[1]}`, val: p => change(at(p.budget && p.budget[D.fte_key], FB[0]), at(p.budget && p.budget[D.fte_key], FB[1])) },
  { id: "pervisit", label: `Change in budget per visit after inflation, FY${FB[0]} to FY${FB[1]}`, val: p => noCmp(p) ? null : change(at(p.perVisit, FB[0]), at(p.perVisit, FB[1])) },
];
const CLASSES = [ // percent change bins, fixed for every measure
  { max: -20, c: "--dn2", t: "Down 20% or more" },
  { max: -5, c: "--dn1", t: "Down 5% to 20%" },
  { max: 5, c: "--flat", t: "Within 5%" },
  { max: 20, c: "--up1", t: "Up 5% to 20%" },
  { max: Infinity, c: "--up2", t: "Up 20% or more" },
];
// down 20% or more | more than 5% down | within 5% | 5% up to 20% | 20% up or more
const cls = v => { if (v == null) return null; const r = round(v); // bins use the whole-number change the table shows
  return CLASSES[r <= -20 ? 0 : r <= -5 ? 1 : r < 5 ? 2 : r < 20 ? 3 : 4]; };
let metric = METRICS[0], sel = null, hover = null;

// ---------- map ----------
const map = $("map"), mctx = map.getContext("2d");
// shaded relief (Natural Earth SR_50M, reprojected into this map's drawing space by scripts/relief.py),
// a separate file loaded after the map first draws
let RELIEF = null;
{ const img = new Image(); img.onload = () => { RELIEF = img; drawMap(); }; img.src = "relief.jpg"; }
// view: the fitted map (k0, ox0, oy0) times a zoom z, shifted by (tx, ty) screen pixels
let view = { k: 1, ox: 0, oy: 0, k0: 1, ox0: 0, oy0: 0, z: 1, tx: 0, ty: 0, dpr: 1 };
const ZMAX = 10;
const VMAX = Math.max(...PARKS.map(p => at(p.visits, VB[1]) || 0));
// dots keep their screen size when zooming in, so crowded parks pull apart
const radius = p => { const v = at(p.visits, VB[1]); return 3 + 9 * Math.sqrt((v || 0) / VMAX); };
function applyView() {
  const r = map.getBoundingClientRect(), z = view.z;
  // keep the map on screen: no panning past its edges
  const w = view.k0 * G.w * z, h = view.k0 * G.h * z;
  const minx = Math.min(0, r.width - (view.ox0 * z + w)), maxx = Math.max(0, -view.ox0 * z);
  const miny = Math.min(0, r.height - (view.oy0 * z + h)), maxy = Math.max(0, -view.oy0 * z);
  view.tx = z === 1 ? 0 : Math.min(maxx, Math.max(minx, view.tx));
  view.ty = z === 1 ? 0 : Math.min(maxy, Math.max(miny, view.ty));
  view.k = view.k0 * z; view.ox = view.ox0 * z + view.tx; view.oy = view.oy0 * z + view.ty;
  $("zoomOut").disabled = z <= 1; $("zoomIn").disabled = z >= ZMAX; $("zoomReset").disabled = z <= 1;
  map.style.cursor = z > 1 ? "grab" : "pointer";
  drawMap();
}
function resizeMap() {
  const r = map.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  map.width = Math.round(r.width * dpr); map.height = Math.round(r.height * dpr);
  const k0 = Math.min(r.width / G.w, r.height / G.h);
  Object.assign(view, { k0, ox0: (r.width - k0 * G.w) / 2, oy0: (r.height - k0 * G.h) / 2, dpr });
  applyView();
}
function zoomAt(mx, my, f) { // zoom by factor f, keeping the map point under (mx, my) where it is
  // screen x = (ox0 + k0 x) z + tx; holding mx fixed: tx' = mx - (mx - ox0 z - tx) g - ox0 z', with g = z' / z
  const z = Math.min(ZMAX, Math.max(1, view.z * f)), g = z / view.z;
  view.tx = mx - (mx - view.ox0 * view.z - view.tx) * g - view.ox0 * z;
  view.ty = my - (my - view.oy0 * view.z - view.ty) * g - view.oy0 * z;
  view.z = z; applyView();
}
const sx = x => view.ox + view.k * x, sy = y => view.oy + view.k * y;
function ringPath(ctx, flat) { ctx.moveTo(sx(flat[0]), sy(flat[1])); for (let i = 2; i < flat.length; i += 2) ctx.lineTo(sx(flat[i]), sy(flat[i + 1])); ctx.closePath(); }
function drawMap() {
  const ctx = mctx; ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.clearRect(0, 0, map.width, map.height);
  ctx.fillStyle = css("--sea"); ctx.fillRect(0, 0, map.width, map.height);
  ctx.beginPath(); for (const s of G.states) ringPath(ctx, s.ring);
  ctx.fillStyle = css("--land"); ctx.fill("evenodd");

// ---------- charts ----------
function niceStep(range, n) { const raw = range / n, p = 10 ** Math.floor(Math.log10(raw)), f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }

  const step = niceStep(vmax, 3), ymax = Math.ceil(vmax / step) * step;

    const gx = X(opts.gapFrom - 0.5);

  }

    ctx.fillStyle = css("--muted"); ctx.fillText(opts.fmt(v), L - 5, Y(v));

  const span = x1 - x0, ys = span > 30 ? 10 : span > 12 ? 5 : span > 5 ? 2 : 1;
  for (let y = Math.ceil(x0 / ys) * ys; y <= x1; y += ys) {
    const t = opts.ylab ? opts.ylab(y) : String(y), w = ctx.measureText(t).width / 2;
    ctx.fillStyle = css("--muted"); ctx.fillText(t, Math.min(Math.max(X(y), L + w), W - R - w), H - B + 4); }
  ctx.strokeStyle = css("--axis"); ctx.beginPath(); ctx.moveTo(L, Y(0)); ctx.lineTo(W - R, Y(0)); ctx.stroke();
  for (const m of opts.markers || []) {

.hswitch .track { position: relative; width: 34px; height: 20px; border-radius: 999px; background: var(--axis); transition: background .2s; flex: none; }

:"Zion National Park","short":"Zion","state_names":"Utah","visits":{"y0":1979,"v":[1040528,1123846,1288808,1246290,1273030,1377254,1503272,1670503,1777619,1948332,1998856,2102400,2236997,2390626,2392580,2270871,2430162,2498001,2445534,2370048,2449664,2432348,2217779,2592545,2458792,2677342,2586665,2567350,2657281,2690154,2735402,2665972,2825505,2973607,2807387,3189696,3648846,4295127,4504812,4320033,4488268,3591254,5039835,4692417,4623238,4946592,4984525]},"method_changes":[{"year":1992,"note":"Major: 1992 is first record of PPV multipliers used with traffic counts; Kolob Terrance changed from pneumatic tube to inductive loop; Changed from direct count of overnight stays in NPS campground to sites occupied times PPV multiplier; Added illegal roadside camping under miscellaneous overnight stays; May have updated non-recreation and non-reportable vehicles?; Added length of stay multipliers","source":"https://irma.nps.gov/Stats/SSRSReports/Park%20Specific%20Reports/Park%20Visitor%20Use%20and%20Count%20Procedure%20Changes?Park=ZION","major":true},{"year":2000,"note":"Minor: Added number of visitors entering at River Station Entrance; Removed illegal roadside camping","source":"https://irma.nps.gov/Stats/SSRSReports/Park%20Specific%20Reports/Park%20Visitor%20Use%20and%20Count%20Procedure%20Changes?Park=ZION","major":false},{"year":2013,"note":"Minor: Changed from direct count of bus passengers to using persons-per-bus multiplier","source":"https://irma.nps.gov/Stats/SSRSReports/Park%20Specific%20Reports/Park%20Visitor%20Use%20and%20Count%20Procedure%20Changes?Park=ZION","major":false},{"year":2019,"note":"Major: Changed from persons per bus multiplier to actual count of bus passengers; Updated persons per vehicle multipliers for South Entrance, East Entrance and Kolob Canyons","source":"https://irma.nps.gov/Stats/SSRSReports/Park%20Specific%20Reports/Park%20Visitor%20Use%20and%20Count%20Procedure%20Changes?Park=ZION","major":true},{"year":2023,"note":"Minor: Switched from using tent/rv sites occupied with a persons per site multiplier to actual overnight stays from rec.gov.","source":"https://irma.nps.gov/Stats/SSRSReports/Park%20Specific%20Reports/Park%20Visitor%20Use%20and%20Count%20Procedure%20Changes?Park=ZION","major":false}],"designated":null,"history":{"text":"Proclaimed Mukuntuweap National Monument on July 31, 1909. Renamed Zion National Monument on March 18, 1918. Established as Zion National Park on Nov. 19, 1919. Covers about 147,000 acres.","sources":["https://www.nps.gov/aboutus/upload/npindex2012-2016.pdf#page=103"],"acres_source":"https://www.nps.gov/subjects/lwcf/upload/NPS-Acreage-09-30-2026.xlsx"},"visit_note":null,"park_report":null,"budget":{"base_k":{"y0":2008,"v":[7201,7787,8307,7981,7708,7243,7581,7621,7737,7762,7874,8033,8207,8475,8692,9115]},"park_base_fte":{"y0":2008,"v":[83,84,83,80,76,75,73,73,75,70,69,69,76,76,68,68]},"total_fte":{"y0":2008,"v":[164,173,184,184,175,167,168,166,165,173,162,155,160,177,164,169]}},"budget_members":["ZION"],"per_visit_ok":true,"budget_note":""}],"cpi":{"y0":1979,"v":[70.4417,80.0083,88.8833,95.4417,98.7917,102.85,106.6417,109.2583,112.3833,117.0167,122.5833,128.7,135.1917,139.2667,143.4917,147.2583,151.3917,155.625,159.775,162.3833,165.5,170.7583,176.2583,178.9,183.1,187.35,193.5083,200.6333,205.3383,214.4628,213.7678,217.3691,223.1367,228.5259,232.2467,236.0085,236.7418,238.9393,243.8411,249.7485,254.3764,258.0143,266.6158,287.7232,302.2893,311.581,319.9966]},"cpi_base_fy":2025,"compare":{"visits":[2012,2025],"budget":[2012,2023]},"series_start":2008,"budget_last_fy":2023,"budget_axis_end":2025,"fte_key":"total_fte","fte_label":"all staff","fte_desc":"Every position at the park, whatever money pays for it, measured in full-time equivalents (FTE): the hours worked divided by the hours in a full-time work year.","intro":"Each dot is a national park. Pick a measure above to color the map, or click a park to see how it has changed. Park figures come from the National Park Service and the Interior Department. Budget figures are each park's base operating budget, adjusted for inflation unless the chart says otherwise.","availability":[{"text":"The Park Service's budget book for FY2027 no longer has the table of each park's budget and staff, or the section on park visitation and acreage. The park table was in every book from FY2010 to FY2025, and the FY2025 book also had the visitation and acreage section.","links":[{"label":"FY2025 book","url":"https://www.doi.gov/sites/default/files/documents/2024-03/fy2025-508-nps-greenbook_2.pdf"},{"label":"FY2027 book","url":"https://www.doi.gov/sites/default/files/documents/2026-04/fy2027greenbooknps_0.pdf"}]},{"text":"The Park Service did not release a budget book for FY2026, according to the Congressional Research Service. So the last year with a published budget for every park is FY2023. A few parks post newer figures on their own websites, and we found no park-by-park table for any later year.","links":[{"label":"CRS report R42757","url":"https://www.everycrsreport.com/reports/R42757.html"},{"label":"Interior's FY2026 budget page","url":"https://www.doi.gov/budget/appropriations/2026"}]},{"text":"Congress did not get the FY2026 book either. The Senate Appropriations Committee wrote in July 2025 that it \"has not received the detailed budget justification for the National Park Service for fiscal year 2026.\" The final FY2026 spending law's explanatory statement directs the Park Service to brief the committees every 60 days on \"staffing levels by park and visitor data by park.\" Those briefings go only to the committees, and we found no public copy.","links":[{"label":"Senate Report 119-46, p. 47","url":"https://www.govinfo.gov/content/pkg/CRPT-119srpt46/pdf/CRPT-119srpt46.pdf"},{"label":"Congressional Record, Jan. 8, 2026, H474","url":"https://www.govinfo.gov/content/pkg/CREC-2026-01-08/html/CREC-2026-01-08-pt3-PgH255.htm"}]},{"text":"The Park Service's park-by-park repair backlog reports for FY2014 to FY2018 now return \"page not found,\" and its FY2024 park fact sheets were replaced with FY2025 versions. We found copies only in the Internet Archive, and for FY2024 only for 25 parks. We found no park figures from the Park Service for FY2019 to FY2021. For FY2023, a Congressional Research Service report lists 20 parks \"using data from NPS,\" but we found no Park Service file.","links":[{"label":"Archived FY2018 report page","url":"https://web.archive.org/web/2022/https://www.nps.gov/subjects/infrastructure/identifying-reporting-deferred-maintenance.htm"},{"label":"Current page","url":"https://www.nps.gov/subjects/plandesignconstruct/defermain.htm"}]}],"sources":[{"name":"NPS Visitor Use Statistics (IRMA)","url":"https://irma.nps.gov/Stats/","what":"recreation visits by park and month, 1979 to 2025"},{"name":"NPS budget justifications, FY2010 to FY2025","url":"https://www.nps.gov/aboutus/budget.htm","what":"each park's base budget and staff, FY2008 to FY2023"},{"name":"BLS Consumer Price Index (CPI-U)","url":"https://www.bls.gov/cpi/","what":"inflation adjustment, by federal fiscal year"},{"name":"NPS Land Resources Division","url":"https://public-nps.opendata.arcgis.com/","what":"park boundaries and locations"},{"name":"U.S. Census Bureau cartographic boundaries","url":"https://www.census.gov/geographies/mapping-files/time-series/geo/cartographic-boundary.html","what":"state outlines"},{"name":"Natural Earth shaded relief (SR_50M)","url":"https://www.naturalearthdata.com/downloads/50m-raster-data/50m-shaded-relief/","what":"terrain shading on the map"}],"source_line":"Sources: National Park Service, Interior Department, Bureau of Labor Statistics, Census Bureau. Shaded relief: Natural Earth. Alaska, Hawaii and the islands are not to scale."}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("payload").textContent);
if (window.self !== window.top) { document.body.classList.add("framed"); document.documentElement.dataset.theme = "light"; }
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const MONTHS = ["Jan.", "Feb.", "March", "April", "May", "June", "July", "Aug.", "Sept.", "Oct.", "Nov.", "Dec."];
const G = D.geo, PARKS = D.parks, BY = Object.fromEntries(PARKS.map(p => [p.code, p]));

// ---------- numbers ----------
// half away from zero, so the tie-out can match it exactly
const round = (v, d = 0) => { const f = 10 ** d; return Math.sign(v) * Math.round(Math.abs(v) * f) / f; };
const int = v => round(v).toLocaleString("en-US");
function big(v) { // 1,234,567 -> "1.2 million"
  const a = Math.abs(v);
  if (a >= 1e9) return round(v / 1e9, 1).toLocaleString("en-US", { minimumFractionDigits: 1 }) + " billion";
  if (a >= 1e6) return round(v / 1e6, 1).toLocaleString("en-US", { minimumFractionDigits: 1 }) + " million";
  return int(v);
}
const usd = v => "$" + big(v);
const money = v => v === 0 ? "$0" : "$" + (v >= 1e9 ? round(v / 1e9, 1) + "B" : v >= 1e6 ? round(v / 1e6, 1) + "M" : round(v / 1e3) + "K");
const usd2 = v => "$" + round(v, 2).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = v => { const r = round(v); return (r > 0 ? "+" : r < 0 ? "−" : "") + Math.abs(r).toLocaleString("en-US") + "%"; };
const change = (a, b) => (a > 0 && b != null) ? (b / a - 1) * 100 : null;
const updown = v => round(v) === 0 ? "about the same as" : (v > 0 ? "up " : "down ") + Math.abs(round(v)).toLocaleString("en-US") + "% from";

// ---------- series ----------
// every series is {y0, v:[...]} with null for years not published
const at = (s, y) => (s && y >= s.y0 && y < s.y0 + s.v.length) ? s.v[y - s.y0] : null;
const years = s => s ? s.v.map((_, i) => s.y0 + i) : [];
const lastYear = s => { if (!s) return null; for (let i = s.v.length - 1; i >= 0; i--) if (s.v[i] != null) return s.y0 + i; return null; };
const firstYear = s => { if (!s) return null; for (let i = 0; i < s.v.length; i++) if (s.v[i] != null) return s.y0 + i; return null; };
const CPI = D.cpi, CPI_BASE = D.cpi_base_fy;
const real = (v, fy) => (v == null || at(CPI, fy) == null) ? null : v * at(CPI, CPI_BASE) / at(CPI, fy);
function mapS(s, f) { return s ? { y0: s.y0, v: s.v.map((v, i) => v == null ? null : f(v, s.y0 + i)) } : null; }

for (const p of PARKS) {
  p.budgetReal = mapS(p.budget && p.budget.base_k, (v, fy) => real(v * 1000, fy));
  // visits for the whole budget line (shared lines sum their parks' visits)
  const members = p.budget_members.map(c => BY[c] || null);
  p.lineVisits = p.budget ? { y0: p.budget.base_k.y0, v: p.budget.base_k.v.map((_, i) => {
    const y = p.budget.base_k.y0 + i;
    const vals = members.map(m => m ? at(m.visits, y) : null);
    return vals.some(v => v == null) ? null : vals.reduce((a, b) => a + b, 0);
  }) } : null;
  p.perVisit = p.budgetReal && p.per_visit_ok && !(p.visit_note && p.visit_note.no_compare) ? { y0: p.budgetReal.y0, v: p.budgetReal.v.map((v, i) => {
    const n = p.lineVisits.v[i]; return (v == null || !n) ? null : v / n; }) } : null;
}

// ---------- map metrics ----------
const VB = D.compare.visits, FB = D.compare.budget;
const noCmp = p => !!(p.visit_note && p.visit_note.no_compare);
const METRICS = [
  { id: "visits", label: `Change in visits, ${VB[0]} to ${VB[1]}`, val: p => noCmp(p) ? null : change(at(p.visits, VB[0]), at(p.visits, VB[1])) },
  { id: "budget", label: `Change in base budget after inflation, FY${FB[0]} to FY${FB[1]}`, val: p => change(at(p.budgetReal, FB[0]), at(p.budgetReal, FB[1])) },
  { id: "staff", label: `Change in staff (${D.fte_label}), FY${FB[0]} to FY${FB[1]}`, val: p => change(at(p.budget && p.budget[D.fte_key], FB[0]), at(p.budget && p.budget[D.fte_key], FB[1])) },
  { id: "pervisit", label: `Change in budget per visit after inflation, FY${FB[0]} to FY${FB[1]}`, val: p => noCmp(p) ? null : change(at(p.perVisit, FB[0]), at(p.perVisit, FB[1])) },
];
const CLASSES = [ // percent change bins, fixed for every measure
  { max: -20, c: "--dn2", t: "Down 20% or more" },
  { max: -5, c: "--dn1", t: "Down 5% to 20%" },
  { max: 5, c: "--flat", t: "Within 5%" },
  { max: 20, c: "--up1", t: "Up 5% to 20%" },
  { max: Infinity, c: "--up2", t: "Up 20% or more" },
];
// down 20% or more | more than 5% down | within 5% | 5% up to 20% | 20% up or more
const cls = v => { if (v == null) return null; const r = round(v); // bins use the whole-number change the table shows
  return CLASSES[r <= -20 ? 0 : r <= -5 ? 1 : r < 5 ? 2 : r < 20 ? 3 : 4]; };
let metric = METRICS[0], sel = null, hover = null;

// ---------- map ----------
const map = $("map"), mctx = map.getContext("2d");
// shaded relief (Natural Earth SR_50M, reprojected into this map's drawing space by scripts/relief.py),
// a separate file loaded after the map first draws
let RELIEF = null;
{ const img = new Image(); img.onload = () => { RELIEF = img; drawMap(); }; img.src = "relief.jpg"; }
// view: the fitted map (k0, ox0, oy0) times a zoom z, shifted by (tx, ty) screen pixels
let view = { k: 1, ox: 0, oy: 0, k0: 1, ox0: 0, oy0: 0, z: 1, tx: 0, ty: 0, dpr: 1 };
const ZMAX = 10;
const VMAX = Math.max(...PARKS.map(p => at(p.visits, VB[1]) || 0));
// dots keep their screen size when zooming in, so crowded parks pull apart
const radius = p => { const v = at(p.visits, VB[1]); return 3 + 9 * Math.sqrt((v || 0) / VMAX); };
function applyView() {
  const r = map.getBoundingClientRect(), z = view.z;
  // keep the map on screen: no panning past its edges
  const w = view.k0 * G.w * z, h = view.k0 * G.h * z;
  const minx = Math.min(0, r.width - (view.ox0 * z + w)), maxx = Math.max(0, -view.ox0 * z);
  const miny = Math.min(0, r.height - (view.oy0 * z + h)), maxy = Math.max(0, -view.oy0 * z);
  view.tx = z === 1 ? 0 : Math.min(maxx, Math.max(minx, view.tx));
  view.ty = z === 1 ? 0 : Math.min(maxy, Math.max(miny, view.ty));
  view.k = view.k0 * z; view.ox = view.ox0 * z + view.tx; view.oy = view.oy0 * z + view.ty;
  $("zoomOut").disabled = z <= 1; $("zoomIn").disabled = z >= ZMAX; $("zoomReset").disabled = z <= 1;
  map.style.cursor = z > 1 ? "grab" : "pointer";
  drawMap();
}
function resizeMap() {
  const r = map.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  map.width = Math.round(r.width * dpr); map.height = Math.round(r.height * dpr);
  const k0 = Math.min(r.width / G.w, r.height / G.h);
  Object.assign(view, { k0, ox0: (r.width - k0 * G.w) / 2, oy0: (r.height - k0 * G.h) / 2, dpr });
  applyView();
}
function zoomAt(mx, my, f) { // zoom by factor f, keeping the map point under (mx, my) where it is
  // screen x = (ox0 + k0 x) z + tx; holding mx fixed: tx' = mx - (mx - ox0 z - tx) g - ox0 z', with g = z' / z
  const z = Math.min(ZMAX, Math.max(1, view.z * f)), g = z / view.z;
  view.tx = mx - (mx - view.ox0 * view.z - view.tx) * g - view.ox0 * z;
  view.ty = my - (my - view.oy0 * view.z - view.ty) * g - view.oy0 * z;
  view.z = z; applyView();
}
const sx = x => view.ox + view.k * x, sy = y => view.oy + view.k * y;
function ringPath(ctx, flat) { ctx.moveTo(sx(flat[0]), sy(flat[1])); for (let i = 2; i < flat.length; i += 2) ctx.lineTo(sx(flat[i]), sy(flat[i + 1])); ctx.closePath(); }
function drawMap() {
  const ctx = mctx; ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.clearRect(0, 0, map.width, map.height);
  ctx.fillStyle = css("--sea"); ctx.fillRect(0, 0, map.width, map.height);
  ctx.beginPath(); for (const s of G.states) ringPath(ctx, s.ring);
  ctx.fillStyle = css("--land"); ctx.fill("evenodd");
  if (RELIEF) { // shaded relief on land only, hard-light: mid-gray changes nothing
    ctx.save(); ctx.clip("evenodd"); ctx.globalCompositeOperation = "hard-light";
    ctx.globalAlpha = parseFloat(css("--relief")) || 0.75; ctx.imageSmoothingQuality = "high";
    ctx.drawImage(RELIEF, sx(0), sy(0), view.k * G.w, view.k * G.h); ctx.restore();
  }
  ctx.strokeStyle = css("--land-edge"); ctx.lineWidth = 0.6; ctx.stroke();
  ctx.beginPath(); for (const c in G.parks) for (const r of G.parks[c].rings) ringPath(ctx, r);
  ctx.fillStyle = css("--parkfill"); ctx.fill("evenodd");
  ctx.strokeStyle = css("--axis"); ctx.lineWidth = 0.8; ctx.fillStyle = css("--muted"); ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.font = Math.round(Math.max(9, Math.min(11, 13 * view.k))) + "px system-ui, sans-serif";
  const SHORT = { VI: "Virgin Is.", AS: "Am. Samoa" };
  for (const b of G.insets) {
    if (b.id === "VI" || b.id === "AS") ctx.strokeRect(sx(b.x), sy(b.y), view.k * b.w, view.k * b.h);
    const t = ctx.measureText(b.label).width > view.k * b.w - 6 && SHORT[b.id] ? SHORT[b.id] : b.label;
    ctx.fillText(t, sx(b.x) + 3, sy(b.y + b.h) - 4);
  }
  const order = [...PARKS].sort((a, b) => radius(b) - radius(a));
  for (const p of order) {
    const g = G.parks[p.code], k = cls(metric.val(p)), r = radius(p);
    ctx.beginPath(); ctx.arc(sx(g.x), sy(g.y), r, 0, 2 * Math.PI);
    ctx.fillStyle = k ? css(k.c) : css("--none"); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = css("--ring"); ctx.stroke();
    ctx.beginPath(); ctx.arc(sx(g.x), sy(g.y), r - 0.5, 0, 2 * Math.PI);
    ctx.lineWidth = 1; ctx.strokeStyle = k ? "rgba(0,0,0,0.25)" : css("--muted"); ctx.stroke();
  }
  for (const c of [hover, sel]) if (c) {
    const g = G.parks[c]; ctx.beginPath(); ctx.arc(sx(g.x), sy(g.y), radius(BY[c]) + 3, 0, 2 * Math.PI);
    ctx.lineWidth = 2; ctx.strokeStyle = css("--sel"); ctx.stroke();
  }
  if (sel) { // label the selected park
    const g = G.parks[sel], name = BY[sel].short; ctx.font = "600 12px system-ui, sans-serif";
    const w = ctx.measureText(name).width, rr = radius(BY[sel]) + 6, right = sx(g.x) + rr;
    const x = right + w + 4 <= map.width / view.dpr ? right : Math.max(4, sx(g.x) - rr - w);
    ctx.lineWidth = 3; ctx.strokeStyle = css("--surface"); ctx.strokeText(name, x, sy(g.y) + 4);
    ctx.fillStyle = css("--ink"); ctx.fillText(name, x, sy(g.y) + 4);
  }
}
function hit(ev) {

  let best = null, bd = Infinity;
  for (const p of PARKS) {
    const g = G.parks[p.code], d = Math.hypot(sx(g.x) - x, sy(g.y) - y);
    const reach = radius(p) + (ev.pointerType === "touch" ? 14 : 6);

  }

}
function showTip(h) {
  const tip = $("mapTip");
  if (!h.code) { tip.style.display = "none"; return; }
  const p = BY[h.code], v = metric.val(p);
  tip.innerHTML = `<strong>${p.short}</strong><br>${v == null ? "Not available for this period" : pct(v) + " " + metric.label.replace(/^Change in /, "").replace(/,.*/, "")}<br>${at(p.visits, VB[1]) != null ? big(at(p.visits, VB[1])) + " visits in " + VB[1] : ""}`;
  tip.style.display = "block";
  const wrap = map.parentElement.getBoundingClientRect();
  tip.style.left = Math.min(h.x + 12, wrap.width - tip.offsetWidth - 4) + "px";
  tip.style.top = Math.max(h.y - tip.offsetHeight - 8, 4) + "px";
}
// pointers: one finger or the mouse pans (once zoomed in) or clicks; two fingers pinch
const pts = new Map(); let drag = null, pinch = null;
map.addEventListener("pointerdown", ev => {
  map.setPointerCapture(ev.pointerId); pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (pts.size === 1) drag = { x: ev.clientX, y: ev.clientY, tx: view.tx, ty: view.ty, moved: false };
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: view.z }; drag = null; }
});
map.addEventListener("pointermove", ev => {
  if (pts.has(ev.pointerId)) pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (pinch && pts.size === 2) {
    const [a, b] = [...pts.values()], r = map.getBoundingClientRect();
    zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d / view.z);
    return;
  }
  if (drag && pts.size === 1) {
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (Math.hypot(dx, dy) > 4) drag.moved = true;
    if (drag.moved && view.z > 1) { view.tx = drag.tx + dx; view.ty = drag.ty + dy; map.style.cursor = "grabbing"; $("mapTip").style.display = "none"; applyView(); return; }
  }
  const h = hit(ev);
  if (h.code !== hover) { hover = h.code; drawMap(); }
  showTip(h);
});
function endPointer(ev) {
  const wasDrag = drag && drag.moved;
  pts.delete(ev.pointerId);
  if (pts.size < 2) pinch = null;
  if (ev.type === "pointerup" && drag && !wasDrag && pts.size === 0) { const h = hit(ev); if (h.code) select(h.code); }
  if (pts.size === 0) { drag = null; map.style.cursor = view.z > 1 ? "grab" : "pointer"; }
}
map.addEventListener("pointerup", endPointer);
map.addEventListener("pointercancel", endPointer);
map.addEventListener("pointerleave", () => { if (!pts.size) { hover = null; $("mapTip").style.display = "none"; drawMap(); } });
// wheel zooms only with ctrl or cmd (trackpad pinch sends ctrl), so scrolling the article still scrolls
map.addEventListener("wheel", ev => {
  if (!(ev.ctrlKey || ev.metaKey)) return;
  ev.preventDefault(); const r = map.getBoundingClientRect();
  zoomAt(ev.clientX - r.left, ev.clientY - r.top, Math.exp(-ev.deltaY * 0.01));
}, { passive: false });
const centerZoom = f => { const r = map.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, f); };
$("zoomIn").onclick = () => centerZoom(2);
$("zoomOut").onclick = () => centerZoom(0.5);
$("zoomReset").onclick = () => { view.z = 1; applyView(); };

function drawLegend() {
  const n = PARKS.filter(p => metric.val(p) == null).length;
  $("mapLegend").innerHTML = `<span class="lt">${metric.label}</span>` +
    CLASSES.map(k => `<span class="key"><b style="background:var(${k.c})"></b>${k.t}</span>`).join("") +
    (n ? `<span class="key"><b style="background:var(--none);border-color:var(--muted)"></b>Not available (${n})</span>` : "") +
    `<span class="key">Dot size: visits in ${VB[1]}</span>`;
}

// ---------- charts ----------
function niceStep(range, n) { const raw = range / n, p = 10 ** Math.floor(Math.log10(raw)), f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }
function setupCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return { ctx, W: r.width, H: r.height };
}
// opts: {series, fmt, tipfmt(y), x0, x1, markers:[{year,label}], gapFrom, gapLabel, bars}
function chart(cv, opts) {
  const { ctx, W, H } = setupCanvas(cv), s = opts.series;
  const hasGap = opts.gapFrom != null && opts.gapFrom <= opts.x1;
  const L = 46, R = 8, T = hasGap ? 22 : 8, B = 18; // a band above the plot holds the gap label, clear of the data
  const x0 = opts.x0, x1 = opts.x1;
  const vals = years(s).filter(y => y >= x0 && y <= x1).map(y => at(s, y)).filter(v => v != null), vmax = Math.max(...vals) * 1.08 || 1;
  const step = niceStep(vmax, 3), ymax = Math.ceil(vmax / step) * step;
  const X = y => L + (W - L - R) * (x1 === x0 ? 0.5 : (y - x0) / (x1 - x0)), Y = v => T + (H - T - B) * (1 - v / ymax);
  ctx.clearRect(0, 0, W, H);
  if (opts.gapFrom != null && opts.gapFrom <= x1) { // years past the last published figure
    const gx = X(opts.gapFrom - 0.5);
    ctx.fillStyle = css("--shade"); ctx.fillRect(gx, T, W - R - gx, H - T - B);
  }
  ctx.font = "11px system-ui, sans-serif"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (let v = 0; v <= ymax + 1e-9; v += step) {
    ctx.strokeStyle = css("--grid"); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(L, Y(v)); ctx.lineTo(W - R, Y(v)); ctx.stroke();
    ctx.fillStyle = css("--muted"); ctx.fillText(opts.fmt(v), L - 5, Y(v));
  }
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  const span = x1 - x0, ys = span > 30 ? 10 : span > 12 ? 5 : span > 5 ? 2 : 1;
  for (let y = Math.ceil(x0 / ys) * ys; y <= x1; y += ys) {
    const t = opts.ylab ? opts.ylab(y) : String(y), w = ctx.measureText(t).width / 2;
    ctx.fillStyle = css("--muted"); ctx.fillText(t, Math.min(Math.max(X(y), L + w), W - R - w), H - B + 4); }
  ctx.strokeStyle = css("--axis"); ctx.beginPath(); ctx.moveTo(L, Y(0)); ctx.lineTo(W - R, Y(0)); ctx.stroke();
  for (const m of opts.markers || []) {
    if (m.year < x0 || m.year > x1) continue;
    ctx.strokeStyle = css("--muted"); ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(X(m.year), T); ctx.lineTo(X(m.year), H - B); ctx.stroke(); ctx.setLineDash([]);
  }
  if (opts.dots) { // separate readings: no line, so years with a method change are not joined
    for (const y of years(s)) { const v = at(s, y); if (v == null) continue;
      ctx.beginPath(); ctx.arc(X(y), Y(v), 4.5, 0, 2 * Math.PI); ctx.fillStyle = css("--line"); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = css("--surface"); ctx.stroke(); }
  } else if (opts.bars) {
    const bw = Math.max(2, (W - L - R) / (x1 - x0 + 1) - 3);
    ctx.fillStyle = css("--line");
    for (const y of years(s)) { const v = at(s, y); if (v == null) continue;
      const x = X(y) - bw / 2, top = Y(v), h = Y(0) - top; ctx.beginPath(); ctx.roundRect(x, top, bw, h, [3, 3, 0, 0]); ctx.fill(); }
  } else {
    ctx.strokeStyle = css("--line"); ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.beginPath();
    let pen = false;
    for (const y of years(s)) { const v = at(s, y); if (v == null || y < x0 || y > x1) { pen = false; continue; }
      if (!pen) { ctx.moveTo(X(y), Y(v)); pen = true; } else ctx.lineTo(X(y), Y(v)); }
    ctx.stroke();
    ctx.fillStyle = css("--line"); // single isolated points still show
    for (const y of years(s)) { const v = at(s, y); if (v == null) continue;
      const lone = at(s, y - 1) == null && at(s, y + 1) == null; if (lone) { ctx.beginPath(); ctx.arc(X(y), Y(v), 3, 0, 2 * Math.PI); ctx.fill(); } }
  }
  if (hasGap) { // one line in the band above the plot, ending over the shaded years
    ctx.fillStyle = css("--muted"); ctx.font = "11px system-ui, sans-serif"; ctx.textAlign = "right"; ctx.textBaseline = "alphabetic";
    ctx.fillText(opts.gapLabel, W - R, 13);
  }
  const snap = ctx.getImageData(0, 0, cv.width, cv.height), tip = cv.parentElement.querySelector(".tip");
  cv.onpointermove = ev => {
    const r = cv.getBoundingClientRect(), mx = ev.clientX - r.left;
    let y = Math.round(x0 + (mx - L) / (W - L - R) * (x1 - x0)); y = Math.max(x0, Math.min(x1, y));
    ctx.putImageData(snap, 0, 0);
    const dpr = window.devicePixelRatio || 1; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const v = at(s, y);
    ctx.strokeStyle = css("--axis"); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(X(y), T); ctx.lineTo(X(y), H - B); ctx.stroke();
    if (v != null && !opts.bars) { ctx.beginPath(); ctx.arc(X(y), Y(v), 4.5, 0, 2 * Math.PI); ctx.fillStyle = css("--line"); ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = css("--surface"); ctx.stroke(); }
    tip.innerHTML = opts.tipfmt(y, v); tip.style.display = "block";
    tip.style.left = Math.max(0, Math.min(X(y) + 10, W - tip.offsetWidth)) + "px"; tip.style.top = "-6px";
  };
  cv.onpointerleave = () => { ctx.putImageData(snap, 0, 0); tip.style.display = "none"; };
}

// ---------- panel ----------
const span = (s, a, b) => [Math.min(a, firstYear(s) ?? a), b];
function select(code, push = true) {
  sel = code; drawMap();
  $("parkSel").value = code || "";
  $("intro").classList.toggle("hidden", !!code); $("parkView").classList.toggle("hidden", !code);
  if (push) history.replaceState(null, "", code ? "#" + code : location.pathname + location.search);
  if (!code) return;
  const p = BY[code];
  $("pName").textContent = p.name; $("pState").textContent = p.state_names;
  drawPark(p);
}
function drawPark(p) {
  // visits open at the first budget year, like every other series; the switch shows the whole record
  const vfirst = firstYear(p.visits), vy1 = lastYear(p.visits), vy0 = longHistory ? vfirst : Math.max(vfirst, D.series_start);
  const sw = $("histSw"); sw.classList.toggle("hidden", vfirst >= D.series_start);
  sw.setAttribute("aria-checked", String(longHistory));
  $("histLbl").textContent = `Show full record, from ${vfirst}`;
  const dg = $("pDesig"), showDg = p.designated && p.designated.year > vy0;
  dg.classList.toggle("hidden", !showDg);
  dg.innerHTML = showDg ? `The visit chart starts before the park got its current name in ${p.designated.year}, so earlier years count it under its old name.` : "";
  const src = [...p.history.sources, p.history.acres_source].filter(Boolean);
  $("pHist").innerHTML = `${p.history.text} <span class="srcs">(${src.map((u, i) => `<a href="${u}" target="_blank" rel="noopener">${i < p.history.sources.length ? "NPS source" : "acreage"}${p.history.sources.length > 1 && i < p.history.sources.length ? " " + (i + 1) : ""}</a>`).join(", ")})</span>`;
  $("tVisits").textContent = `Recreation visits per year, ${vy0} to ${vy1}`;
  $("sVisits").textContent = "One visit is one person entering the park for recreation on one day. Dashed lines mark years with a major change in how the park counts.";
  chart($("cVisits"), { series: p.visits, x0: vy0, x1: vy1, fmt: v => v >= 1e6 ? round(v / 1e6, 1) + "M" : v >= 1e3 ? round(v / 1e3) + "K" : String(v),
    markers: p.method_changes.filter(m => m.major), tipfmt: (y, v) => `<strong>${y}</strong><br>${v == null ? "Not published" : int(v) + " visits"}${(p.method_changes || []).filter(m => m.year === y).map(m => "<br>Counting changed: " + m.note).join("")}` });
  const a = at(p.visits, VB[0]), b = at(p.visits, VB[1]);
  $("stVisits").innerHTML = `<span id="vLast">${int(at(p.visits, vy1))}</span> visits in ${vy1}.` + (a && b && !noCmp(p) ? ` That is <span id="vChg">${updown(change(a, b))}</span> ${VB[0]}.` : "");
  const vf = $("nVisitFix"); vf.classList.toggle("hidden", !p.visit_note);
  vf.innerHTML = p.visit_note ? `${p.visit_note.text} (<a href="${p.visit_note.source}" target="_blank" rel="noopener">${p.visit_note.label}</a>)` : "";
  const mc = $("nVisits"), mj = p.method_changes.filter(m => m.major); mc.classList.toggle("hidden", !p.method_changes.length);
  mc.innerHTML = p.method_changes.length ? `The park changed how it counts visits ${p.method_changes.length === 1 ? "once" : p.method_changes.length + " times"} since 1979` +
    (mj.length ? `, with major changes in ${mj.map(m => m.year).join(", ")}` : "") + `. Jumps in those years may come from the change, not from more or fewer visits. <a href="${p.method_changes[0].source}" target="_blank" rel="noopener">Every change, from the Park Service</a>` : "";

  const hasB = !!p.budget;
  for (const id of ["bStaff", "bPerVisit"]) $(id).classList.toggle("hidden", !hasB);
  $("bPerVisit").classList.toggle("hidden", !p.perVisit);
  for (const id of ["cBudget", "stBudget"]) $(id).closest(".chartwrap, .stat").classList.toggle("hidden", !hasB);
  $("tBudget").textContent = "Park base budget"; $("sBudget").textContent = "";
  const sh = $("nShared"); sh.classList.toggle("hidden", !p.budget_note); sh.textContent = p.budget_note;
  const pr = $("nPark"); pr.classList.toggle("hidden", !p.park_report);
  pr.innerHTML = p.park_report ? `${p.park_report.text} (<a href="${p.park_report.source}" target="_blank" rel="noopener">park source</a>)` : "";
  if (hasB) {

    const gap = { gapFrom: D.budget_last_fy + 1, gapLabel: `Shaded: no park-by-park table after FY${D.budget_last_fy}` };
    $("tBudget").textContent = `Park base budget, FY${b0} to FY${b1}, in FY${CPI_BASE} dollars`;
    $("sBudget").textContent = "The park's share of the Park Service's main operating account. It leaves out money from other accounts, such as construction, entrance fees, donations and Great American Outdoors Act projects.";
    chart($("cBudget"), { series: p.budgetReal, x0: b0, x1: gx1, ...gap, fmt: money, tipfmt: (y, v) => `<strong>FY${y}</strong><br>${v == null ? "Not published" : usd(v) + ` in FY${CPI_BASE} dollars<br>` + usd(at(p.budget.base_k, y) * 1000) + " as published"}` });
    const r0 = at(p.budgetReal, FB[0]), r1 = at(p.budgetReal, FB[1]);
    $("stBudget").innerHTML = `<span id="bLast">${usd(at(p.budget.base_k, b1) * 1000)}</span> in FY${b1} as published.` + (r0 && r1 ? ` After inflation, that is <span id="bChg">${updown(change(r0, r1))}</span> FY${FB[0]}.` : "");

    const fte = p.budget[D.fte_key];
    $("tStaff").textContent = `Staff, FY${b0} to FY${b1}, in full-time equivalents`;
    $("sStaff").textContent = D.fte_desc;
    chart($("cStaff"), { series: fte, x0: b0, x1: gx1, ...gap, fmt: v => int(v),
      tipfmt: (y, v) => `<strong>FY${y}</strong><br>${v == null ? "Not published" : int(v) + " full-time equivalents"}` });
    const f0 = at(fte, FB[0]), f1 = at(fte, FB[1]);
    $("stStaff").innerHTML = `<span id="fLast">${int(at(fte, b1))}</span> in FY${b1}.` + (f0 && f1 ? ` That is <span id="fChg">${updown(change(f0, f1))}</span> FY${FB[0]}.` : "");

    if (p.perVisit) {
    $("tPerVisit").textContent = `Base budget per visit, FY${b0} to FY${b1}, in FY${CPI_BASE} dollars`;
    $("sPerVisit").textContent = "Our calculation: the fiscal year's base budget divided by recreation visits in the calendar year with the same number. Fiscal years start Oct. 1.";
    chart($("cPerVisit"), { series: p.perVisit, x0: b0, x1: gx1, ...gap, fmt: v => "$" + round(v, v < 10 ? 1 : 0),
      tipfmt: (y, v) => `<strong>FY${y}</strong><br>${v == null ? "Not available" : usd2(v) + " per visit"}` });
    const q0 = at(p.perVisit, FB[0]), q1 = at(p.perVisit, FB[1]);
    $("stPerVisit").innerHTML = q1 != null ? `<span id="pvLast">${usd2(q1)}</span> per visit in FY${FB[1]}.` + (q0 && !noCmp(p) ? ` That is <span id="pvChg">${updown(change(q0, q1))}</span> FY${FB[0]}.` : "") : "";
    }
  }
}

// ---------- intro, table, controls ----------
function buildIntro() {
  $("introText").innerHTML = D.intro;
  $("availBox").innerHTML = `<p class="figtitle">What is missing</p>` + `<ul>${D.availability.map(a => `<li>${a.text} ${a.links.map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join(", ")}</li>`).join("")}</ul>`;
  $("srcBox").innerHTML = `<p class="figtitle">Sources</p><ul>${D.sources.map(s => `<li><a href="${s.url}" target="_blank" rel="noopener">${s.name}</a>: ${s.what}</li>`).join("")}</ul>`;
  $("srcLine").textContent = D.source_line;
}
function buildTable() {
  const rows = [...PARKS].sort((a, b) => a.short.localeCompare(b.short));
  $("parkTable").innerHTML = `<thead><tr><th>Park</th><th>Visits ${VB[1]}</th>${METRICS.map(m => `<th>${m.id === "visits" ? "Visits" : m.id === "budget" ? "Budget" : m.id === "staff" ? "Staff" : "Per visit"} change</th>`).join("")}</tr></thead><tbody>` +
    rows.map(p => `<tr><td><button type="button" data-code="${p.code}">${p.short}</button></td><td>${at(p.visits, VB[1]) != null ? int(at(p.visits, VB[1])) : "n/a"}</td>${METRICS.map(m => { const v = m.val(p); return `<td>${v == null ? "n/a" : pct(v)}</td>`; }).join("")}</tr>`).join("") + "</tbody>";
  $("parkTable").querySelector("thead").insertAdjacentHTML("beforebegin", `<caption class="figsub" style="text-align:left">Visits change is ${VB[0]} to ${VB[1]}. Budget, staff and per-visit changes are FY${FB[0]} to FY${FB[1]}, budget after inflation.</caption>`);
  $("parkTable").onclick = ev => { const c = ev.target.dataset && ev.target.dataset.code; if (c) select(c); };
}
$("metricSel").innerHTML = METRICS.map(m => `<option value="${m.id}">${m.label}</option>`).join("");
$("metricSel").onchange = () => { metric = METRICS.find(m => m.id === $("metricSel").value); drawLegend(); drawMap(); };
$("parkSel").innerHTML = `<option value="">All parks</option>` + [...PARKS].sort((a, b) => a.short.localeCompare(b.short)).map(p => `<option value="${p.code}">${p.short}</option>`).join("");
$("parkSel").onchange = () => select($("parkSel").value || null);
$("backBtn").onclick = () => select(null);
let longHistory = false;
try { longHistory = localStorage.getItem("np-long-history") === "1"; } catch (e) {}
$("histSw").onclick = () => {
  longHistory = !longHistory;
  try { localStorage.setItem("np-long-history", longHistory ? "1" : "0"); } catch (e) {}
  if (sel) drawPark(BY[sel]);
};
function fromHash() { const c = location.hash.slice(1).toUpperCase(); select(BY[c] ? c : null, false); }
buildIntro(); buildTable(); drawLegend(); resizeMap(); fromHash();
window.addEventListener("hashchange", fromHash);
new ResizeObserver(() => { resizeMap(); if (sel) drawPark(BY[sel]); }).observe(document.querySelector(".app"));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { drawMap(); if (sel) drawPark(BY[sel]); });
</script>
</body>
